[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnapps-hdmi-processor"
version = "0.1.1"
description = "wdnwebui HDMI / 电脑外设类应用插件：智能电脑控制（HDMI-IN 抓帧 + USB HID 注入）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pyrk-sdk" }]

# 与 wdnapps_video_analyzer 同理：不声明 wdnwebui 依赖（宿主不是
# PyPI 包，是同一个 .venv 里从仓库根跑的 FastAPI 服务）。
# 真正的外部依赖是下面这两个 SDK —— 它们才是本 wheel 独立于宿主的
# 那部分可安装前提。
dependencies = [
    "pydantic>=1.10",
    "fastapi>=0.100",
    "wdnhid>=0.1.0",
    "wdnav>=0.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/rockchip-wardner/wdnapps_hdmi_processor"
Repository = "https://github.com/rockchip-wardner/wdnapps_hdmi_processor"
Issues = "https://github.com/rockchip-wardner/wdnapps_hdmi_processor/issues"

[project.entry-points."wdnwebui.cards"]
"usb-hid" = "wdnapps_hdmi_processor.cards.usb_hid"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnapps_hdmi_processor*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"wdnapps_hdmi_processor.cards.usb_hid" = ["manifest.json", "static/*"]